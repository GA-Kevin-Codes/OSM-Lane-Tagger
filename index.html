<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lane Tagger</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#fff;--text:#1a1a1a;--muted:#6b6b6b;--border:#e2e2e2;--panel:#f6f6f6;--accent:#3b6fe0;

    --warn:#8a5a12;

    /* road/viz surface colors — constant across light/dark UI theme */
    --asphalt:#787d85;--lane-line:#ffffff;--center-yellow:#d9a916;
    --bike-lane:#7fbf8f;--restricted:#c05a5a;--bus-lane:#c9705f;--bothways-fill:#8c7f52;
    --parking-band:#5c6169;--parking-car:#aeb3bb;--kerb:#d6d9de;
    --viz-arrow:#ffffff;--viz-caption:#f2f2f2;
  }
  body.dark{--bg:#161616;--text:#e8e8e8;--muted:#8f8f8f;--border:#333;--panel:#1f1f1f;--accent:#6fa0ff;--warn:#e3b05c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em;color:var(--muted)}

  header{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;padding:1.5rem 1.5rem 0}
  h1{font-size:1.1rem;margin:0;font-weight:600}
  #darkmode{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text);opacity:.7;padding:2px}
  #darkmode:hover{opacity:1}

  main{max-width:960px;margin:0 auto;padding:0 1.5rem 3rem}
  section{padding:.9rem 0;border-top:1px solid var(--border)}
  section:first-child{border-top:none}
  h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 .8rem;cursor:default;width:fit-content}

  .row{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;align-items:center}
  .row+.row{margin-top:.6rem}
  label{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;cursor:pointer}
  select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.3rem .45rem;font:inherit}
  input[type=checkbox]{accent-color:var(--accent);cursor:pointer}

  button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:.32rem .6rem;font:inherit;cursor:pointer}
  button:hover{background:var(--panel)}
  button:disabled{opacity:.35;cursor:not-allowed}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .primary:hover{opacity:.88;background:var(--accent)}

  pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.75rem;font-size:.82rem;overflow:auto;white-space:pre-wrap;margin:0 0 .6rem}

  /* lane editor */
  .lane-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:stretch}
  .lane-card{border:1px solid var(--border);border-radius:8px;padding:.6rem;width:220px;flex:0 0 auto;transition:opacity .15s}
  .lane-card.dragging{opacity:.35}
  .lane-card.drag-over-left{box-shadow:inset 3px 0 0 0 var(--accent)}
  .lane-card.drag-over-right{box-shadow:inset -3px 0 0 0 var(--accent)}
  .lane-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;font-size:.72rem;color:var(--muted)}
  .lane-card-head-left{display:flex;align-items:center;gap:.35rem}
  .lane-drag-handle{cursor:grab;font-size:.85rem;line-height:1;user-select:none}
  .lane-drag-handle:active{cursor:grabbing}
  .lane-card-actions button{padding:1px 5px;font-size:.68rem;margin-left:2px;line-height:1.4}
  .lane-field{margin:.5rem 0}
  .lane-field-label{display:block;font-size:.62rem;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .lane-field select{width:100%;padding:.25rem .35rem;font-size:.78rem}
  .turn-checks{display:grid;grid-template-columns:1fr;gap:2px 6px}
  .turn-checks label{font-size:.7rem;gap:3px;margin:0;white-space:nowrap}
  .add-lane-btn{width:52px;min-height:96px;border:1px dashed var(--border);background:none;border-radius:8px;font-size:1.2rem;color:var(--muted);align-self:stretch}
  .add-lane-btn:hover{background:var(--panel);color:var(--text)}

  #vizWrap{overflow-x:auto}
  #viz{display:block}

  /* paste-in panel */
  summary{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;cursor:pointer;width:fit-content;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "}
  details[open]>summary::before{content:"▾ "}
  details[open]>summary{margin-bottom:.8rem}
  textarea{display:block;width:100%;min-height:104px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.6rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.5;resize:vertical}
  #pasteStatus{margin-top:.55rem;font-size:.8rem;display:grid;gap:.15rem}
  #pasteStatus .warn{color:var(--warn)}
  #pasteStatus .dim{color:var(--muted)}

  /* left/right-of-road controls (parking) */
  .side-row{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center}
  .side-row+.side-row{margin-top:.45rem}
  .side-name{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;width:68px}
  select:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>🛣️ Lane Tagger</h1>
  <button id="darkmode" title="Toggle dark mode">🌙</button>
</header>

<main>
  <section>
    <details id="pasteDetails">
      <summary title="Read existing tags back into the editor — paste from JOSM, iD, Overpass or this tool's own output">Paste tags</summary>
      <textarea id="pasteInput" spellcheck="false" placeholder="Paste OSM tags — one key=value per line, e.g.&#10;lanes=3&#10;oneway=yes&#10;turn:lanes=left|through|through;right&#10;parking:both=lane"></textarea>
      <div class="row" style="margin-top:.55rem">
        <button id="loadBtn" class="primary">Load into editor</button>
        <button id="pasteClearBtn">Clear</button>
      </div>
      <div id="pasteStatus"></div>
    </details>
  </section>

  <section>
    <div class="row">
      <label>Direction
        <select id="modeSelect">
          <option value="oneway">One-way</option>
          <option value="twoway">Two-way</option>
        </select>
      </label>
      <label id="onewayTagWrap"><input type="checkbox" id="onewayTag"> <code>oneway=yes</code></label>
      <span id="drivingSideWrap" title="Diagram only — doesn't change tags">
        <select id="drivingSide">
          <option value="right">Right-hand traffic</option>
          <option value="left">Left-hand traffic</option>
        </select>
      </span>
    </div>
    <div class="row" id="contraflowRow" title="A cycle lane running against the one-way. It's tagged with the side-cycleway keys (cycleway:left/right), not with :lanes, and it isn't counted in lanes=*"></div>
    <div class="row" id="laneDefaults" title="Pre-fills newly added lanes; Apply to all lanes also bulk-sets lanes that already exist"></div>
  </section>

  <section>
    <h2 id="forwardLegend" title="Lane 1 = nearest the centerline (or the road's edge, in one-way mode); higher numbers move toward the outer curb. Whichever side ends up drawn left of the centerline below is mirrored to match, same as JOSM's lane view.">Lanes</h2>
    <div class="lane-row" id="forwardLanes"></div>
  </section>

  <section id="backwardFieldset">
    <h2>Backward</h2>
    <div class="lane-row" id="backwardLanes"></div>
  </section>

  <section id="bothWaysFieldset">
    <h2 title="A lane shared by both directions of traffic — e.g. a center two-way left-turn lane">Both-ways</h2>
    <div class="lane-row" id="bothWaysLanes"></div>
  </section>

  <section>
    <h2 title="Left and right are the way's own sides, looking along the ▲ forward direction. When both sides match, the tags collapse to the parking:both shorthand.">On-street parking</h2>
    <div id="parkingRows"></div>
  </section>

  <section>
    <h2>Diagram</h2>
    <div id="vizWrap"><svg id="viz"></svg></div>
  </section>

  <section>
    <h2>Tags</h2>
    <pre id="output"></pre>
    <button id="copyBtn" class="primary">Copy</button>
  </section>
</main>

<script>
(function(){
  "use strict";

  // ---------- option tables ----------
  var TURN_DEFS = [
    ['sharp_left','⬉ Sharp left'],
    ['left','⬅ Left'],
    ['slight_left','↖ Slight left'],
    ['through','⬆ Through'],
    ['slight_right','↗ Slight right'],
    ['right','➡ Right'],
    ['sharp_right','⬈ Sharp right'],
    ['merge_to_left','⇦ Merge left'],
    ['merge_to_right','⇨ Merge right'],
    ['reverse','↩ Reverse'],
    ['none','⊘ None (no arrow)']
  ];
  var TURN_VALUES={};
  TURN_DEFS.forEach(function(d){ TURN_VALUES[d[0]]=1; });
  var BICYCLE_DEFS = [
    ['','– unspecified –'],['yes','yes'],['designated','designated (bike lane)'],
    ['no','no'],['permissive','permissive'],['dismount','dismount']
  ];
  var VEHICLE_DEFS = [
    ['','– unspecified –'],['yes','yes'],['no','no'],['designated','designated'],
    ['permissive','permissive'],['hov','hov (carpool)']
  ];
  var CYCLEWAY_DEFS = [
    ['','– unspecified –'],['no','no'],['lane','lane (painted)'],
    ['share_busway','share_busway'],['track','track (separated)']
  ];
  var BUS_DEFS = [
    ['','– unspecified –'],['yes','yes'],['designated','designated (bus lane)'],
    ['no','no'],['permissive','permissive']
  ];
  var TAG_KEY = {turn:'turn:lanes', bicycle:'bicycle:lanes', vehicle:'vehicle:lanes', cycleway:'cycleway:lanes', bus:'psv:lanes'};
  var CATS = ['turn','bicycle','vehicle','cycleway','bus'];
  var DEFS_BY_CAT = {bicycle:BICYCLE_DEFS, vehicle:VEHICLE_DEFS, cycleway:CYCLEWAY_DEFS, bus:BUS_DEFS};

  // Contraflow cycling on a oneway street, per the wiki's M3a/M3b examples:
  // oneway=yes + oneway:bicycle=no + cycleway:<side>=lane + cycleway:<side>:oneway=-1.
  // "shared" is the no-infrastructure case (oneway:bicycle=no on its own), which also
  // covers the deprecated cycleway=opposite.
  var CONTRAFLOW_DEFS = [
    ['lane','lane — painted contraflow lane'],
    ['track','track — separated'],
    ['shared','shared — no separate lane']
  ];
  var PARKING_DEFS = [
    ['','– none / not set –'],
    ['lane','lane — on the carriageway'],
    ['street_side','street_side — bays beside it'],
    ['half_on_kerb','half_on_kerb'],
    ['on_kerb','on_kerb — on the footway'],
    ['shoulder','shoulder'],
    ['separate','separate — mapped separately'],
    ['yes','yes — position unknown'],
    ['no','no — no parking here']
  ];
  var ORIENTATION_DEFS = [
    ['','– unspecified –'],['parallel','parallel'],['diagonal','diagonal'],['perpendicular','perpendicular']
  ];
  // Positions that describe vehicles actually standing beside the road — the only ones
  // an :orientation applies to, and the only ones drawn as a band in the diagram.
  var PARKING_PHYSICAL = {lane:1, street_side:1, half_on_kerb:1, on_kerb:1, shoulder:1, yes:1};

  function defsHas(defs, v){
    return defs.some(function(d){ return d[0]===v; });
  }

  // ---------- state ----------
  function defaultLane(){ return {turns:new Set(), bicycle:'', vehicle:'', cycleway:'', bus:''}; }

  var state = {
    mode:'twoway',
    drivingSide:'right',
    onewayTag:true,
    forward:[defaultLane()],
    backward:[defaultLane()],
    bothWays:[],
    // Seeds newly-added lanes and, via "Apply to all lanes", bulk-sets existing
    // ones too — set the common case once instead of re-picking it on every lane.
    // Turn isn't included: it's quick enough to pick per-lane and rarely repeats.
    laneDefault:{bicycle:'', vehicle:'', cycleway:'', bus:''},
    contraflow:{on:false, side:'left', type:'lane'},
    // Sides of the way, looking along the forward direction.
    parking:{left:{type:'',orientation:''}, right:{type:'',orientation:''}}
  };

  function contraflowActive(){
    // oneway:bicycle=no only says anything on a street that is actually tagged oneway.
    return state.mode==='oneway' && state.onewayTag && state.contraflow.on;
  }

  function laneGroup(name){
    if(name==='forward') return state.forward;
    if(name==='backward') return state.backward;
    return state.bothWays;
  }

  // ---------- lane editor ----------
  // Drag-to-reorder: dragState tracks the array being reordered and the source
  // index so drops are only accepted within the same lane group (forward stays
  // forward, etc.), same as the ◀/▶ buttons already only move within their group.
  var dragState=null;
  function clearDragOverIndicators(){
    Array.prototype.forEach.call(document.querySelectorAll('.lane-card.drag-over-left,.lane-card.drag-over-right'), function(c){
      c.classList.remove('drag-over-left','drag-over-right');
    });
  }

  function buildSelectField(labelText, defs, current, onChange){
    var field=document.createElement('div'); field.className='lane-field';
    var lbl=document.createElement('span'); lbl.className='lane-field-label'; lbl.textContent=labelText;
    var sel=document.createElement('select');
    defs.forEach(function(d){
      var opt=document.createElement('option'); opt.value=d[0]; opt.textContent=d[1];
      if(d[0]===current) opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function(){ onChange(sel.value); });
    field.appendChild(lbl); field.appendChild(sel);
    return field;
  }

  function buildTurnField(turns, onChange){
    var field=document.createElement('div'); field.className='lane-field';
    var lbl=document.createElement('span'); lbl.className='lane-field-label'; lbl.textContent='Turn';
    field.appendChild(lbl);
    var grid=document.createElement('div'); grid.className='turn-checks';
    TURN_DEFS.forEach(function(d){
      var val=d[0], label=d[1];
      var wrap=document.createElement('label');
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=turns.has(val);
      cb.addEventListener('change', function(){
        if(val==='none'){
          if(cb.checked){ turns.clear(); turns.add('none'); }
          else { turns.delete('none'); }
        } else {
          turns.delete('none');
          if(cb.checked) turns.add(val); else turns.delete(val);
        }
        onChange();
      });
      wrap.appendChild(cb);
      wrap.appendChild(document.createTextNode(' '+label));
      grid.appendChild(wrap);
    });
    field.appendChild(grid);
    return field;
  }

  function buildLaneFields(card, lane, onChange){
    card.appendChild(buildTurnField(lane.turns, onChange));
    card.appendChild(buildSelectField('Bicycle', BICYCLE_DEFS, lane.bicycle, function(v){ lane.bicycle=v; onChange(); }));
    card.appendChild(buildSelectField('Vehicle', VEHICLE_DEFS, lane.vehicle, function(v){ lane.vehicle=v; onChange(); }));
    card.appendChild(buildSelectField('Cycleway', CYCLEWAY_DEFS, lane.cycleway, function(v){ lane.cycleway=v; onChange(); }));
    card.appendChild(buildSelectField('Bus', BUS_DEFS, lane.bus, function(v){ lane.bus=v; onChange(); }));
  }

  function buildLaneCard(lane, i, arr, minCount){
    var card=document.createElement('div'); card.className='lane-card'; card.draggable=true;

    var head=document.createElement('div'); head.className='lane-card-head';
    var headLeft=document.createElement('div'); headLeft.className='lane-card-head-left';
    var handle=document.createElement('span'); handle.className='lane-drag-handle'; handle.textContent='⠿'; handle.title='Drag to reorder';
    var title=document.createElement('span'); title.textContent='Lane '+(i+1);
    headLeft.appendChild(handle); headLeft.appendChild(title);
    var actions=document.createElement('div'); actions.className='lane-card-actions';

    var btnL=document.createElement('button'); btnL.type='button'; btnL.textContent='◀'; btnL.title='Move left';
    btnL.disabled=(i===0);
    btnL.addEventListener('click', function(){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; renderAll(); });

    var btnR=document.createElement('button'); btnR.type='button'; btnR.textContent='▶'; btnR.title='Move right';
    btnR.disabled=(i===arr.length-1);
    btnR.addEventListener('click', function(){ var t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; renderAll(); });

    var btnX=document.createElement('button'); btnX.type='button'; btnX.textContent='✕'; btnX.title='Remove lane';
    btnX.disabled=(arr.length<=minCount);
    btnX.addEventListener('click', function(){ arr.splice(i,1); renderAll(); });

    actions.appendChild(btnL); actions.appendChild(btnR); actions.appendChild(btnX);
    head.appendChild(headLeft); head.appendChild(actions);
    card.appendChild(head);

    // Drag is only armed when the gesture starts on the grip handle, so dragging
    // the card doesn't fight with clicking selects/checkboxes or selecting label text.
    var handleActive=false;
    handle.addEventListener('mousedown', function(){ handleActive=true; });
    card.addEventListener('mouseup', function(){ handleActive=false; });
    card.addEventListener('dragstart', function(e){
      if(!handleActive){ e.preventDefault(); return; }
      handleActive=false;
      dragState={arr:arr, index:i};
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', String(i));
      requestAnimationFrame(function(){ card.classList.add('dragging'); });
    });
    card.addEventListener('dragend', function(){
      card.classList.remove('dragging');
      clearDragOverIndicators();
      dragState=null;
    });
    card.addEventListener('dragover', function(e){
      if(!dragState || dragState.arr!==arr) return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      var rect=card.getBoundingClientRect();
      var isAfter=(e.clientX-rect.left) > rect.width/2;
      clearDragOverIndicators();
      card.classList.add(isAfter ? 'drag-over-right' : 'drag-over-left');
    });
    card.addEventListener('dragleave', function(e){
      if(!card.contains(e.relatedTarget)) card.classList.remove('drag-over-left','drag-over-right');
    });
    card.addEventListener('drop', function(e){
      if(!dragState || dragState.arr!==arr) return;
      e.preventDefault();
      e.stopPropagation();
      var rect=card.getBoundingClientRect();
      var isAfter=(e.clientX-rect.left) > rect.width/2;
      var fromIndex=dragState.index, toIndex=i+(isAfter?1:0);
      var item=arr.splice(fromIndex,1)[0];
      if(fromIndex<toIndex) toIndex--;
      arr.splice(toIndex,0,item);
      dragState=null;
      renderAll();
    });

    buildLaneFields(card, lane, renderAll);

    return card;
  }

  function renderLaneGroup(container, groupName, minCount){
    minCount = minCount || 0;
    var arr = laneGroup(groupName);
    container.innerHTML='';
    arr.forEach(function(lane, i){ container.appendChild(buildLaneCard(lane, i, arr, minCount)); });
    var addBtn=document.createElement('button'); addBtn.type='button'; addBtn.className='add-lane-btn'; addBtn.textContent='+'; addBtn.title='Add lane';
    addBtn.addEventListener('click', function(){
      var lane=defaultLane();
      lane.bicycle=state.laneDefault.bicycle;
      lane.vehicle=state.laneDefault.vehicle;
      lane.cycleway=state.laneDefault.cycleway;
      lane.bus=state.laneDefault.bus;
      arr.push(lane);
      renderAll();
    });
    container.appendChild(addBtn);
  }

  // The one place a user sets the common case for bicycle/vehicle/cycleway/bus
  // once, instead of re-picking it on every lane. Built once (not per-render):
  // nothing else on the page needs to reflect these values changing, since they
  // only take effect when a lane is added or "Apply to all lanes" is clicked.
  function buildLaneDefaultsRow(container){
    var def = state.laneDefault;
    function field(labelText, defs, key){
      var lbl=document.createElement('label');
      lbl.appendChild(document.createTextNode(labelText+' '));
      var sel=document.createElement('select');
      defs.forEach(function(d){
        var opt=document.createElement('option'); opt.value=d[0]; opt.textContent=d[1];
        if(d[0]===def[key]) opt.selected=true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', function(){ def[key]=sel.value; });
      lbl.appendChild(sel);
      container.appendChild(lbl);
    }
    field('Bicycle', BICYCLE_DEFS, 'bicycle');
    field('Vehicle', VEHICLE_DEFS, 'vehicle');
    field('Cycleway', CYCLEWAY_DEFS, 'cycleway');
    field('Bus', BUS_DEFS, 'bus');

    var applyBtn=document.createElement('button'); applyBtn.type='button'; applyBtn.textContent='Apply to all lanes';
    applyBtn.title="Set every lane's bicycle/vehicle/cycleway/bus to these defaults (turn selections are left alone)";
    applyBtn.addEventListener('click', function(){
      [state.forward, state.backward, state.bothWays].forEach(function(arr){
        arr.forEach(function(l){
          l.bicycle=def.bicycle; l.vehicle=def.vehicle; l.cycleway=def.cycleway; l.bus=def.bus;
        });
      });
      renderAll();
    });
    container.appendChild(applyBtn);
  }

  // Built once, like the lane defaults: these controls hold their own state and only
  // need re-syncing when a paste replaces the whole model (updateControlsFromState).
  var contraflowEls=null, parkingEls=null;

  function buildContraflowRow(container){
    var cf=state.contraflow;
    var lbl=document.createElement('label');
    var chk=document.createElement('input'); chk.type='checkbox';
    lbl.appendChild(chk);
    lbl.appendChild(document.createTextNode(' Contraflow cycling'));
    container.appendChild(lbl);

    function sel(defs, key, title){
      var s=document.createElement('select');
      s.title=title;
      defs.forEach(function(d){
        var o=document.createElement('option'); o.value=d[0]; o.textContent=d[1];
        s.appendChild(o);
      });
      s.addEventListener('change', function(){ cf[key]=s.value; renderAll(); });
      container.appendChild(s);
      return s;
    }
    var side=sel([['left','on the left side'],['right','on the right side']], 'side',
      'Which side of the way the contraflow cyclists use (left/right of the ▲ forward direction)');
    var type=sel(CONTRAFLOW_DEFS, 'type', 'What the contraflow direction gets: a painted lane, a separated track, or just shared carriageway');

    chk.addEventListener('change', function(){ cf.on=chk.checked; renderAll(); });
    return {chk:chk, side:side, type:type};
  }

  function buildParkingRows(container){
    var els={};
    ['left','right'].forEach(function(sideName){
      var p=state.parking[sideName];
      var row=document.createElement('div'); row.className='side-row';
      var name=document.createElement('span'); name.className='side-name';
      name.textContent=sideName==='left' ? 'Left' : 'Right';
      row.appendChild(name);

      function sel(defs, key){
        var s=document.createElement('select');
        defs.forEach(function(d){
          var o=document.createElement('option'); o.value=d[0]; o.textContent=d[1];
          s.appendChild(o);
        });
        s.addEventListener('change', function(){ p[key]=s.value; renderAll(); });
        row.appendChild(s);
        return s;
      }
      var type=sel(PARKING_DEFS,'type');
      type.title='parking:'+sideName+'=* — where vehicles stand relative to the carriageway';
      var orient=sel(ORIENTATION_DEFS,'orientation');
      orient.title='parking:'+sideName+':orientation=* — how vehicles are angled to the street';

      container.appendChild(row);
      els[sideName]={type:type, orient:orient};
    });
    return els;
  }

  // Wired once per container (not per render) since the container element
  // itself persists across renderAll() calls.

    });
    container.addEventListener('drop', function(e){
      var arr=laneGroup(groupName);
      if(!dragState || dragState.arr!==arr) return;
      e.preventDefault();

      centerX=laneX+fCount*LANE_W;
      bBlockX=centerX+centerGapW;
    }

    if(plW) drawParkingBand(svg, state.parking.left, 'left', SIDEPAD, TOPPAD, plW, ROAD_H);
    if(prW) drawParkingBand(svg, state.parking.right, 'right', width-SIDEPAD-prW, TOPPAD, prW, ROAD_H);
    var cfStripX = cfLeft ? SIDEPAD+plW : laneX+laneAreaW+cfBuf;
    if(cfStrip) drawContraflowStrip(svg, cf, cfStripX, TOPPAD, LANE_W, ROAD_H);

    // OSM lane order (index 0 = the lane nearest the centerline, i.e. the passing lane;
    // higher indices move toward the outer curb) is fixed by the tag text and doesn't
    // change with driving side. Whichever direction block ends up drawn on the LEFT of
    // the centerline therefore needs to be drawn in reverse array order so index 0 still
    // lands next to the centerline on screen. This matches how JOSM's lane view reads
    // the same :forward/:backward tags.
    var fMirrored = twoway && state.drivingSide!=='right';
    var bMirrored = twoway && state.drivingSide==='right';
    var fDraw = fMirrored ? fArr.slice().reverse() : fArr;
    var bDraw = bMirrored ? bArr.slice().reverse() : bArr;

    fDraw.forEach(function(lane,i){
      drawLane(svg, lane, fBlockX+i*LANE_W, TOPPAD, LANE_W, ROAD_H, 'up', i===fDraw.length-1);
    });
    if(twoway){
      bDraw.forEach(function(lane,i){
        drawLane(svg, lane, bBlockX+i*LANE_W, TOPPAD, LANE_W, ROAD_H, 'down', i===bDraw.length-1);
      });
      if(bwCount>0){
        bwArr.forEach(function(lane,i){
          drawBothWaysLane(svg, lane, centerX+i*LANE_W, TOPPAD, LANE_W, ROAD_H);
        });
      } else {
        drawCenterline(svg, centerX, TOPPAD, CENTER_W, ROAD_H);
      }
    }

    // A painted contraflow lane sits inside the carriageway edge; a track sits outside it.
    var edgeL = laneX - (cfLeft && cf.type==='lane' ? LANE_W : 0);
    var edgeR = laneX + laneAreaW + (cfRight && cf.type==='lane' ? LANE_W : 0);
    svg.appendChild(el('line',{x1:edgeL,y1:TOPPAD,x2:edgeL,y2:TOPPAD+ROAD_H,style:'stroke:var(--lane-line);stroke-width:2'}));
    svg.appendChild(el('line',{x1:edgeR,y1:TOPPAD,x2:edgeR,y2:TOPPAD+ROAD_H,style:'stroke:var(--lane-line);stroke-width:2'}));

    var fLabel = twoway ? '▲ forward' : '▲ direction of travel';
    svg.appendChild(text(fBlockX+fCount*LANE_W/2, TOPPAD-12, 'middle', CAP, fLabel));
    if(twoway){
      svg.appendChild(text(bBlockX+bCount*LANE_W/2, TOPPAD+ROAD_H+20, 'middle', CAP, '▼ backward'));
      if(bwCount>0){
        svg.appendChild(text(centerX+bwCount*LANE_W/2, TOPPAD-12, 'middle', CAP, '↕ both ways'));
      }
    }
    // Contraflow only exists in one-way mode, so the bottom caption row is free here.
    if(cfOn){
      var cfX = cfStrip ? cfStripX+LANE_W/2
        : (cf.side==='left' ? laneX+LANE_W/2 : laneX+laneAreaW-LANE_W/2);
      if(!cfStrip) drawContraflowMarker(svg, cfX, TOPPAD+42);
      svg.appendChild(text(cfX, TOPPAD+ROAD_H+20, 'middle', CAP, '▼ contraflow'));
    }
  }

  // ---------- reading tags back in ----------
  var MAX_LANES=16;

  function unquote(s){
    s=s.trim();
    if(s.length>1 && ((s.charAt(0)==='"'&&s.slice(-1)==='"')||(s.charAt(0)==="'"&&s.slice(-1)==="'"))) s=s.slice(1,-1);
    return s.trim();
  }
  function intOr(v, dflt){
    if(v===null||v==='') return dflt;
    var n=parseInt(v,10);
    return (isNaN(n)||n<0) ? dflt : n;
  }
  function makeLanes(n){
    var a=[]; for(var i=0;i<n;i++) a.push(defaultLane()); return a;
  }

  // Takes what people actually have on the clipboard: key=value lines (this tool's own
  // output, JOSM's tag table, iD's text editor), tab-separated pairs, or raw OSM XML.
  function splitTagText(txt){
    var pairs=[], junk=[], m;
    if(/<tag\s/i.test(txt)){
      var re=/<tag\s+k=(?:"([^"]*)"|'([^']*)')\s+v=(?:"([^"]*)"|'([^']*)')/gi;
      while((m=re.exec(txt))) pairs.push([m[1]||m[2]||'', m[3]||m[4]||'']);
      return {pairs:pairs, junk:junk};
    }
    txt.split(/\r?\n/).forEach(function(raw){
      var line=raw.trim();
      if(!line || line.charAt(0)==='#') return;
      // Whichever separator comes first wins, so a value containing '=' or a tab
      // doesn't get chopped in the wrong place.
      var ti=line.indexOf('\t'), ei=line.indexOf('=');
      var at = ti<0 ? ei : (ei<0 ? ti : Math.min(ti,ei));
      if(at<1){ junk.push(line); return; }
      pairs.push([unquote(line.slice(0,at)), unquote(line.slice(at+1))]);
    });
    return {pairs:pairs, junk:junk};
  }

  function loadFromText(txt){
    var parsed=splitTagText(txt), warns=[], notes=[];
    if(!parsed.pairs.length){
      return {ok:false, count:0, notes:notes, ignored:[], junk:parsed.junk,
        warns:['Nothing to read — paste tags as key=value, one per line.']};
    }
    var seen={}, used={};
    parsed.pairs.forEach(function(p){
      var k=p[0].trim().toLowerCase();
      if(k) seen[k]=p[1].trim();
    });
    function peek(k){ return (k in seen) ? seen[k] : null; }
    function take(k){ if(!(k in seen)) return null; used[k]=1; return seen[k]; }
    function warn(s){ if(warns.indexOf(s)<0) warns.push(s); }
    function note(s){ if(notes.indexOf(s)<0) notes.push(s); }
    function laneKeys(cat, sfx){
      // psv:lanes is what this tool writes; bus:lanes is the common alternative.
      return cat==='bus' ? ['psv:lanes'+sfx,'bus:lanes'+sfx] : [TAG_KEY[cat]+sfx];
    }

    // --- direction ---
    var onewayVal=take('oneway'), isOneway=false, onewayTag=false;
    if(onewayVal!==null){
      var ov=onewayVal.toLowerCase();
      if(ov==='yes'||ov==='true'||ov==='1'){ isOneway=true; onewayTag=true; }
      else if(ov==='-1'||ov==='reverse'){
        isOneway=true; onewayTag=true;
        warn('oneway=-1 read as one-way, but the output below says oneway=yes — put the -1 back if you copy it over.');
      }
      else if(ov!=='no') warn('Unrecognised oneway='+onewayVal+' — treated as two-way.');
    }
    var hasSuffixed=false;
    Object.keys(seen).forEach(function(k){
      if(/^(lanes|turn:lanes|bicycle:lanes|vehicle:lanes|cycleway:lanes|psv:lanes|bus:lanes):(forward|backward|both_ways)$/.test(k)) hasSuffixed=true;
    });
    if(onewayVal===null && !hasSuffixed){
      var bare=CATS.some(function(cat){
        return laneKeys(cat,'').some(function(k){ return peek(k)!==null; });
      });
      // A single left-to-right run of values only pins down one direction of travel.
      if(bare){
        isOneway=true;
        warn('*:lanes tags with no direction suffix and no oneway tag — read as a single direction.');
      }
    }
    state.mode = isOneway ? 'oneway' : 'twoway';
    state.onewayTag = onewayTag;

    // --- how many lanes ---
    var tLanes=take('lanes'), tLF=take('lanes:forward'), tLB=take('lanes:backward'), tLBW=take('lanes:both_ways');
    // On a one-way street both the bare and the :forward form describe the same lanes.
    var fwdSuffixes = isOneway ? ['',':forward'] : [':forward'];

    function countFor(suffixes){
      var n=0, mismatch=false;
      suffixes.forEach(function(sfx){
        CATS.forEach(function(cat){
          laneKeys(cat,sfx).forEach(function(k){
            var v=peek(k);
            if(v===null||v==='') return;
            var c=v.split('|').length;
            if(n && c!==n) mismatch=true;
            n=Math.max(n,c);
          });
        });
      });
      if(mismatch) warn('*:lanes tags disagree on how many values there are — used the longest.');
      return n;
    }
    function clamp(n){
      if(n>MAX_LANES){ warn('Capped at '+MAX_LANES+' lanes per direction.'); return MAX_LANES; }
      return n;
    }

    var fCount, bCount=0, bwCount=0;
    if(isOneway){
      // A pipe-separated run is authoritative: it counts cycle lanes that lanes=* leaves out.
      fCount = countFor(fwdSuffixes) || intOr(tLanes,0) || 1;
      if(tLBW!==null || countFor([':both_ways'])) warn('both_ways tags on a one-way street — ignored.');
    } else {
      fCount = countFor([':forward']) || intOr(tLF,0);
      bCount = countFor([':backward']) || intOr(tLB,0);
      bwCount = countFor([':both_ways']) || intOr(tLBW,0);
      if(!fCount && !bCount){
        var motor=Math.max(0, intOr(tLanes,0)-bwCount);
        if(motor>=2){
          fCount=Math.ceil(motor/2); bCount=motor-fCount;
          if(motor%2) warn('lanes='+tLanes+' is odd with no lanes:forward/lanes:backward — split '+fCount+' forward / '+bCount+' backward.');
        } else if(motor===1){
          fCount=1; bCount=1;
          warn('lanes=1 with no direction split — showing one lane each way.');
        }
      }
    }
    state.forward=makeLanes(clamp(fCount||1));
    state.backward=makeLanes(isOneway ? 1 : clamp(bCount||1));
    state.bothWays=makeLanes(isOneway ? 0 : clamp(bwCount));

    // --- per-lane values ---
    var busAlias=false;
    function fillGroup(arr, suffixes){
      if(!arr.length) return;
      CATS.forEach(function(cat){
        var chosen=null, chosenKey=null;
        suffixes.forEach(function(sfx){
          laneKeys(cat,sfx).forEach(function(k){
            var v=take(k);
            if(v===null) return;
            if(chosen===null){
              chosen=v; chosenKey=k;
              if(k.indexOf('bus:lanes')===0) busAlias=true;
            } else warn('Both '+chosenKey+' and '+k+' present — used '+chosenKey+'.');
          });
        });
        if(chosen===null) return;
        var parts=chosen.split('|');
        if(parts.length!==arr.length) warn(chosenKey+' has '+parts.length+' value(s) for '+arr.length+' lane(s).');
        parts.forEach(function(rawVal, i){
          if(i>=arr.length) return;
          var val=rawVal.trim().toLowerCase();
          if(val==='') return;   // an empty slot means "not specified for this lane"
          if(cat==='turn'){
            val.split(';').forEach(function(t){
              t=t.trim();
              if(!t) return;
              if(TURN_VALUES[t]) arr[i].turns.add(t);
              else warn('Unknown turn value "'+t+'" in '+chosenKey+' — ignored.');
            });
          } else if(defsHas(DEFS_BY_CAT[cat], val)) {
            arr[i][cat]=val;
          } else {
            warn('Unsupported value "'+val+'" in '+chosenKey+' — ignored.');
          }
        });
      });
    }
    fillGroup(state.forward, fwdSuffixes);
    if(!isOneway){
      fillGroup(state.backward, [':backward']);
      fillGroup(state.bothWays, [':both_ways']);
      var bareKeys=[];
      CATS.forEach(function(cat){
        laneKeys(cat,'').forEach(function(k){ if(take(k)!==null) bareKeys.push(k); });
      });
      if(bareKeys.length) warn(bareKeys.join(', ')+' has no :forward/:backward suffix, so it can’t be split across a two-way street — not read.');
    }

    // --- contraflow cycling ---
    state.contraflow={on:false, side:'left', type:'lane'};
    var OPPOSITE={opposite:'shared', opposite_lane:'lane', opposite_track:'track'};
    var obic=take('oneway:bicycle'), cwPlain=take('cycleway');
    var sideVal={left:take('cycleway:left'), right:take('cycleway:right'), both:take('cycleway:both')};
    var sideDir={left:take('cycleway:left:oneway'), right:take('cycleway:right:oneway'), both:take('cycleway:both:oneway')};

    if(cwPlain!==null){
      var cp=cwPlain.toLowerCase();
      if(OPPOSITE[cp]){
        state.contraflow={on:true, side:'left', type:OPPOSITE[cp]};
        warn('cycleway='+cp+' was deprecated by vote in 2024 — read as contraflow on the left; check the side, then copy the replacement tags back.');
      } else if(cp!=='no'){
        warn('cycleway='+cwPlain+' runs with traffic — not modelled here; add it as a lane card instead.');
      }
    }
    ['left','right','both'].forEach(function(sd){
      var v=sideVal[sd];
      if(v===null) return;
      var lv=v.toLowerCase(), side = sd==='both' ? 'left' : sd, contra=false;
      if(OPPOSITE[lv]){
        warn('cycleway:'+sd+'='+lv+' is deprecated — read as cycleway:'+side+'='+OPPOSITE[lv]+' + cycleway:'+side+':oneway=-1.');
        state.contraflow={on:true, side:side, type:OPPOSITE[lv]};
        contra=true;
      } else if((sideDir[sd]||'')==='-1' && (lv==='lane'||lv==='track')){
        state.contraflow={on:true, side:side, type:lv};
        contra=true;
      } else if(lv!=='no'){
        warn('cycleway:'+sd+'='+v+' runs with traffic — not modelled here; add it as a lane card instead.');
      }
      if(contra && sd==='both') warn('cycleway:both read as the left side — this tool tags one contraflow side.');
    });
    if(!state.contraflow.on && obic!==null && obic.toLowerCase()==='no'){
      state.contraflow={on:true, side:'left', type:'shared'};
    }
    if(state.contraflow.on && !(isOneway && onewayTag)){
      state.contraflow.on=false;
      warn('Contraflow tags only mean something alongside oneway=yes — dropped.');
    }

    // --- on-street parking ---
    state.parking={left:{type:'',orientation:''}, right:{type:'',orientation:''}};
    function readPark(target, tv, ov, base){
      if(tv!==null && tv!==''){
        var v=tv.toLowerCase();
        if(defsHas(PARKING_DEFS,v)) target.type=v;
        else warn('Unsupported '+base+'='+tv+' — ignored.');
      }
      if(ov!==null && ov!==''){
        var o=ov.toLowerCase();
        if(defsHas(ORIENTATION_DEFS,o)) target.orientation=o;
        else warn('Unsupported '+base+':orientation='+ov+' — ignored.');
      }
    }
    var pBoth=take('parking:both'), pBothO=take('parking:both:orientation');
    if(pBoth!==null || pBothO!==null){
      var both={type:'',orientation:''};
      readPark(both, pBoth, pBothO, 'parking:both');
      state.parking.left={type:both.type, orientation:both.orientation};
      state.parking.right={type:both.type, orientation:both.orientation};
    }
    // A per-side key beats the :both shorthand it overrides.
    readPark(state.parking.left, take('parking:left'), take('parking:left:orientation'), 'parking:left');
    readPark(state.parking.right, take('parking:right'), take('parking:right:orientation'), 'parking:right');

    var oldParking=Object.keys(seen).filter(function(k){
      return k.indexOf('parking:lane')===0 || k.indexOf('parking:condition')===0;
    });
    if(oldParking.length){
      oldParking.forEach(function(k){ used[k]=1; });
      warn('parking:lane:* / parking:condition:* is deprecated and wasn’t read — re-tag as parking:left/right=* plus :orientation=*.');
    }

    if(busAlias) note('bus:lanes read into the Bus field — it gets written back as psv:lanes.');
    var ignored=Object.keys(seen).filter(function(k){ return !used[k]; });

    updateControlsFromState();
    renderAll();
    return {ok:true, count:Object.keys(seen).length-ignored.length,
      warns:warns, notes:notes, ignored:ignored, junk:parsed.junk};
  }

  function showPasteStatus(rep){
    var box=document.getElementById('pasteStatus');
    box.innerHTML='';
    function line(str, cls){
      var d=document.createElement('div');
      if(cls) d.className=cls;
      d.textContent=str;
      box.appendChild(d);
    }
    if(rep.ok) line('✓ Read '+rep.count+' tag'+(rep.count===1?'':'s')+' into the editor.');
    rep.notes.forEach(function(n){ line('· '+n, 'dim'); });
    rep.warns.forEach(function(w){ line('⚠ '+w, 'warn'); });
    if(rep.ignored.length){
      var shown=rep.ignored.slice(0,10).join(', ');
      line('Left alone (not lane tags): '+shown+(rep.ignored.length>10 ? ' + '+(rep.ignored.length-10)+' more' : ''), 'dim');
    }
    if(rep.junk.length) line(rep.junk.length+' line(s) skipped — no key=value pair found.', 'dim');
  }

  // ---------- top-level render ----------
  function renderAll(){
    document.getElementById('backwardFieldset').style.display = state.mode==='twoway' ? '' : 'none';
    document.getElementById('bothWaysFieldset').style.display = state.mode==='twoway' ? '' : 'none';
    document.getElementById('drivingSideWrap').style.display = state.mode==='twoway' ? '' : 'none';
    document.getElementById('onewayTagWrap').style.display = state.mode==='oneway' ? '' : 'none';
    document.getElementById('forwardLegend').textContent = state.mode==='twoway' ? 'Forward lanes' : 'Lanes';
    document.getElementById('contraflowRow').style.display = (state.mode==='oneway' && state.onewayTag) ? '' : 'none';
    contraflowEls.side.disabled = contraflowEls.type.disabled = !state.contraflow.on;
    ['left','right'].forEach(function(sd){
      parkingEls[sd].orient.disabled = !PARKING_PHYSICAL[state.parking[sd].type];
    });

    renderLaneGroup(document.getElementById('forwardLanes'), 'forward', 1);
    if(state.mode==='twoway'){
      renderLaneGroup(document.getElementById('backwardLanes'), 'backward', 1);
      renderLaneGroup(document.getElementById('bothWaysLanes'), 'bothWays', 0);
    }
    renderViz();
    renderOutput();
  }

  function updateControlsFromState(){
    document.getElementById('modeSelect').value = state.mode;
    document.getElementById('drivingSide').value = state.drivingSide;
    document.getElementById('onewayTag').checked = state.onewayTag;
    contraflowEls.chk.checked = state.contraflow.on;
    contraflowEls.side.value = state.contraflow.side;
    contraflowEls.type.value = state.contraflow.type;
    ['left','right'].forEach(function(sd){
      parkingEls[sd].type.value = state.parking[sd].type;
      parkingEls[sd].orient.value = state.parking[sd].orientation;
    });
  }

  // ---------- wiring ----------
  wireLaneRowDrop(document.getElementById('forwardLanes'), 'forward');
  wireLaneRowDrop(document.getElementById('backwardLanes'), 'backward');
  wireLaneRowDrop(document.getElementById('bothWaysLanes'), 'bothWays');
  buildLaneDefaultsRow(document.getElementById('laneDefaults'));
  contraflowEls = buildContraflowRow(document.getElementById('contraflowRow'));
  parkingEls = buildParkingRows(document.getElementById('parkingRows'));

  document.getElementById('loadBtn').addEventListener('click', function(){
    showPasteStatus(loadFromText(document.getElementById('pasteInput').value));
  });
  document.getElementById('pasteClearBtn').addEventListener('click', function(){
    document.getElementById('pasteInput').value='';
    document.getElementById('pasteStatus').innerHTML='';
  });
  document.getElementById('pasteInput').addEventListener('keydown', function(e){
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
      e.preventDefault();
      document.getElementById('loadBtn').click();
    }
  });

  document.getElementById('modeSelect').addEventListener('change', function(e){ state.mode=e.target.value; renderAll(); });
  document.getElementById('drivingSide').addEventListener('change', function(e){ state.drivingSide=e.target.value; renderAll(); });
  document.getElementById('onewayTag').addEventListener('change', function(e){ state.onewayTag=e.target.checked; renderAll(); });

  document.getElementById('copyBtn').addEventListener('click', function(){
    var btn=document.getElementById('copyBtn');
    navigator.clipboard.writeText(document.getElementById('output').textContent).then(function(){
      var orig=btn.textContent; btn.textContent='Copied!';
      setTimeout(function(){ btn.textContent=orig; }, 1200);
    });
  });

  var darkBtn=document.getElementById('darkmode');
  function applyTheme(dark){
    document.body.classList.toggle('dark', dark);
    darkBtn.textContent = dark ? '☀️' : '🌙';
  }
  var savedTheme = localStorage.getItem('lane-tagger-theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme ? savedTheme==='dark' : prefersDark);
  darkBtn.addEventListener('click', function(){
    var dark = !document.body.classList.contains('dark');
    applyTheme(dark);
    localStorage.setItem('lane-tagger-theme', dark ? 'dark' : 'light');
  });

  updateControlsFromState();
  renderAll();
})();
</script>
</body>
</html>
